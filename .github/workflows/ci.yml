name: CI Test Suite

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend & Clinical Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      CI: "true"
      DATABASE_URL: "sqlite:///./ci_test.db"
      JWT_SECRET_KEY: "ci_test_secret_key_for_testing_purposes_only"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies for headless CV/Audio
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Provision questionnaire fixture from backend resources
      run: |
        python -c "import os, shutil; os.makedirs('data', exist_ok=True); shutil.copyfile('backend/resources/questions.json', 'data/questions.json')"

    - name: Run Pytest Test Suite
      run: |
        python -m pytest -v tests/test_questions.py tests/test_audio_service.py tests/test_clinical_numerical.py tests/test_voice_assistant.py tests/test_database.py tests/test_patient_persistence.py

  frontend:
    name: Frontend Build & Test Suite (Node.js 20)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install npm dependencies
      run: npm install --legacy-peer-deps

    - name: Run Frontend Vitest Unit & Integration Tests
      run: npm test -- --run

    - name: Verify Frontend Production Build
      run: npm run build
